<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Discord Clone{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/discord_style.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% csrf_token %}
    
    {% block content %}{% endblock %}
    
    <!-- Bootstrap 5 JS (обязательно для модальных окон) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
    function getCSRFToken() {
        var token = document.querySelector('[name=csrfmiddlewaretoken]');
        return token ? token.value : '';
    }
    
    function joinServer() {
        var code = document.getElementById('inviteCode');
        if (code && code.value.trim()) {
            location.href = '/servers/join/' + code.value.trim() + '/';
        }
    }
    
    function acceptFriendRequest(id) {
        fetch('/accounts/friend-request/accept/' + id + '/', {
            method: 'POST',
            headers: {'X-CSRFToken': getCSRFToken()}
        }).then(function() { location.reload(); });
    }
    
    function declineFriendRequest(id) {
        fetch('/accounts/friend-request/decline/' + id + '/', {
            method: 'POST',
            headers: {'X-CSRFToken': getCSRFToken()}
        }).then(function() { location.reload(); });
    }
    
    function sendFriendRequest(userId) {
        fetch('/accounts/friend-request/send/' + userId + '/', {
            method: 'POST',
            headers: {'X-CSRFToken': getCSRFToken()}
        }).then(function(r) { return r.json(); })
          .then(function(d) {
              if (d.success) location.reload();
              else alert(d.error || 'Ошибка');
          });
    }
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
